name: daily-shadow-log

# Runs the daily pipeline (pull -> features -> shadow_log -> emit) and
# commits the results back so the shadow window accumulates automatically.
#
# Schedule: 22:30 UTC Mon-Fri (after the 22:00 UTC completed-bar cutoff,
# src/util/session.py) + Sat/Sun weekly-call publish backstops. Also manually triggerable
# via the "Run workflow" button in the GitHub Actions tab.
#
# ============================================================
# HOW TO FLIP LIVE ON SHIP DAY (2026-10-20 approx)
# ============================================================
# 1. Verify Gate 7 cleared: run ship_readiness.py locally or check
#    latest ship_readiness.json in main. Confirm green_light: true
#    and shadow.n_days >= 28.
# 2. In the "Run daily pipeline" step below, append --live to the
#    command. Daily brief stays shadow-only automatically (--live
#    only flips weekly; daily needs a separate --daily-live which we
#    do NOT pass until a v0.3.0 daily-cadence Gate 5 fix lands).
# 3. Commit + push. Next cron run flips weekly to live.
# 4. Then follow handoff-pack/VEGA-MESSAGE.md to relay to Vega.
# ============================================================

on:
  schedule:
    # Weekdays only. US oil markets are closed Sat/Sun so no fresh price
    # data arrives; a Sat/Sun run would fail on shadow_log's stale-data
    # guard. Fri 21:00 UTC catches the Fri close (5pm ET EDT).
    - cron: '30 22 * * MON-FRI'
    # Weekly-call publish slots (added 2026-11-10, Vega ask: publish before
    # the week opens, deadline Mon 00:30 UTC). The weekly call is computed
    # on Friday's close and frozen on first publish, so the Fri 21:00 run
    # usually publishes it (once the Friday bar is complete). These weekend
    # runs are backstops for GitHub's multi-hour cron slip. Day NAMES on
    # purpose - see AXIS's numeric-weekday bug (2026-11-10).
    - cron: '0 12 * * SAT'
    - cron: '0 12 * * SUN'
    - cron: '0 19 * * SUN'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-shadow-log
  cancel-in-progress: false

jobs:
  run-pipeline:
    # Pinned to ubuntu-24.04. Decision 2026-11-10: KEEP pinned while the
    # live-tracked record (from 2026-11-16) builds - no environment changes
    # under a fresh track record. Revisit at the autotrader review gate
    # (docs/memos/2026-11-10_cot_enable_and_followups.md) or when GitHub
    # announces 24.04 deprecation, whichever comes first.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write API keys into .env
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          {
            echo "FRED_API_KEY=${FRED_API_KEY}"
            echo "EIA_API_KEY=${EIA_API_KEY}"
          } > .env
          echo "Wrote .env with $(wc -l < .env) lines"

      - name: Run daily pipeline (LIVE — weekly out of shadow per PROTOCOL v0.2.1)
        env:
          PYTHONIOENCODING: utf-8
          # COT vote ENABLED 2026-11-10 (Owner delegated decision; option (a)
          # from docs/memos/2026-10-12_owner_decisions_cot_fix_and_v2.md).
          # Flipped before W47 so the whole live-tracked record (from
          # 2026-11-16) runs on one model. Re-audit on 2026-11-10 data: all
          # v0.2.0 gates pass; HOLDOUT Sharpe CI low +0.21 -> +0.37, DD 8.8R -> 6.8R.
          # See docs/memos/2026-11-10_cot_enable_and_followups.md.
          HELIOS_COT_ENABLED: "true"
        run: |
          python scripts/daily_pipeline.py \
            --candidate results/bots/bot_v3_seed7_candidate.json \
            --audit results/bots/bot_v3_seed7_candidate_audit.json \
            --live

      - name: Drift monitor (compensating control for early-ship override)
        # The gating check now runs inside daily_pipeline.py BEFORE the weekly
        # is archived. This re-check only makes a trip visible as a red run.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/drift_monitor.py
          # exits 1 on drift → workflow fails visibly. The written
          # admin/drift.flag is auto-committed below and forces the
          # next emit back to SHADOW until Owner deletes it.

      - name: Refresh ship-readiness dashboard
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/ship_readiness.py || true

      - name: Refresh shadow-strip audit (realized R vs model)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Rebuilds results/shadow_audit.json: per-trade realized R from
          # emitted weekly history vs model VAL/HOLDOUT expectation. Keeps
          # Owner's dashboard current without needing to run anything local.
          # Non-fatal — missing data (fresh clone, no emitted history yet)
          # should not break the shadow commit.
          python scripts/shadow_strip_audit.py || true

      - name: Upload emitted artifacts to R2 (prod + staging)
        if: always()
        env:
          # R2 upload uses the S3-compatible endpoint. Secrets are added
          # by Owner via the GitHub repo Secrets UI. If any secret is
          # missing (initial run before Owner adds them), the step
          # skips gracefully so the shadow log commit still lands.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKETS: helios-data-prod helios-data-staging
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 credentials not configured — skipping upload."
            exit 0
          fi
          pip install --quiet awscli
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Every aws call is checked explicitly. Pre-2026-11-11 the uploads ran
          # in a `( set -e ... ) || ...` subshell, where bash IGNORES errexit,
          # so AccessDenied on prod printed "Uploaded" and the step went green.
          # Now: keep uploading the rest (staging still lands if prod fails),
          # then exit 1 if anything failed so the run goes red.
          FAILED=""
          put() {  # put <src> <bucket> <key> [extra aws args...]
            local src="$1" bucket="$2" key="$3"; shift 3
            if aws s3 cp "$src" "s3://${bucket}/${key}" "$@" \
                 --endpoint-url "$ENDPOINT" \
                 --content-type application/json \
                 --cache-control "public, max-age=30, s-maxage=30"; then
              echo "Uploaded ${key} to ${bucket} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              echo "::error::R2 upload FAILED: ${key} -> ${bucket}"
              FAILED="${FAILED} ${bucket}:${key}"
            fi
          }
          for R2_BUCKET in $R2_BUCKETS; do
            # Emitted call/brief/backtest artifacts + equity curve
            for KEY in weekly/current.json daily/current.json backtest/summary.json backtest/curve.json; do
              [ -f "results/emitted/${KEY}" ] && put "results/emitted/${KEY}" "$R2_BUCKET" "$KEY"
            done
            # Shadow-strip audit — not site-rendered; for Owner/Vega dashboards.
            [ -f results/shadow_audit.json ] && put results/shadow_audit.json "$R2_BUCKET" audit/shadow_audit.json
            # Weekly history — index + per-week snapshots (recursive).
            [ -d results/emitted/history ] && put results/emitted/history/ "$R2_BUCKET" history/ --recursive
            # Kill-switch mirror (30s TTL so a flip propagates fast).
            [ -f admin/killswitch.json ] && put admin/killswitch.json "$R2_BUCKET" admin/killswitch.json
          done
          # Read-back: LastModified + generated_at_utc as the bucket serves them.
          for R2_BUCKET in $R2_BUCKETS; do
            for KEY in backtest/summary.json backtest/curve.json admin/killswitch.json weekly/current.json; do
              LM=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$KEY" --endpoint-url "$ENDPOINT" \
                     --query LastModified --output text 2>/dev/null || echo MISSING)
              GEN=$(aws s3 cp "s3://${R2_BUCKET}/${KEY}" - --endpoint-url "$ENDPOINT" 2>/dev/null \
                     | grep -o -m1 '"generated_at_utc": *"[^"]*"' || echo "no generated_at_utc")
              echo "READBACK ${R2_BUCKET}/${KEY} last_modified=${LM} ${GEN}"
            done
          done
          if [ -n "$FAILED" ]; then
            echo "::error::R2 uploads failed:${FAILED}"
            exit 1
          fi

      - name: Commit and push results
        # always(): a tripped drift monitor (exit 1) must still commit
        # admin/drift.flag + the run's artifacts. Pre-2026-11-10 it did not.
        if: always()
        run: |
          git config user.name "helios-bot"
          git config user.email "helios-bot@users.noreply.github.com"
          # Only stage tracked artifact directories; raw data is gitignored
          # and .env must NEVER be committed.
          # history/ is inside results/emitted/ so already covered by that add.
          # NB: `git add A B missing_C` aborts and stages nothing when
          # missing_C doesn't match. Split into separate adds so optional
          # artifacts (drift_status, drift.flag) don't block the required ones.
          git add results/emitted/ results/shadow/ results/ship_readiness.json
          [ -f results/drift_status.json ] && git add results/drift_status.json || true
          [ -f results/shadow_audit.json ] && git add results/shadow_audit.json || true
          [ -f admin/drift.flag ] && git add admin/drift.flag || true
          echo "--- staged changes ---"
          git status --short
          echo "----------------------"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "helios-bot: daily shadow log ${TODAY}

            Automated daily pipeline run — pull data, rebuild features,
            append shadow log entry, refresh emitted artifacts.

            Agent: helios"
            git push
          fi
