name: daily-shadow-log

# Runs the daily pipeline (pull -> features -> shadow_log -> emit) and
# commits the results back so the shadow window accumulates automatically.
#
# Schedule: 21:00 UTC daily (post US-close). Also manually triggerable
# via the "Run workflow" button in the GitHub Actions tab.
#
# ============================================================
# HOW TO FLIP LIVE ON SHIP DAY (2026-10-20 approx)
# ============================================================
# 1. Verify Gate 7 cleared: run ship_readiness.py locally or check
#    latest ship_readiness.json in main. Confirm green_light: true
#    and shadow.n_days >= 28.
# 2. In the "Run daily pipeline" step below, append --live to the
#    command. Daily brief stays shadow-only automatically (--live
#    only flips weekly; daily needs a separate --daily-live which we
#    do NOT pass until a v0.3.0 daily-cadence Gate 5 fix lands).
# 3. Commit + push. Next cron run flips weekly to live.
# 4. Then follow handoff-pack/VEGA-MESSAGE.md to relay to Vega.
# ============================================================

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-shadow-log
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write API keys into .env
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          {
            echo "FRED_API_KEY=${FRED_API_KEY}"
            echo "EIA_API_KEY=${EIA_API_KEY}"
          } > .env
          echo "Wrote .env with $(wc -l < .env) lines"

      - name: Run daily pipeline (LIVE — weekly out of shadow per PROTOCOL v0.2.1)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/daily_pipeline.py \
            --candidate results/bots/bot_v3_seed7_candidate.json \
            --audit results/bots/bot_v3_seed7_candidate_audit.json \
            --live

      - name: Drift monitor (compensating control for early-ship override)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/drift_monitor.py
          # exits 1 on drift → workflow fails visibly. The written
          # admin/drift.flag is auto-committed below and forces the
          # next emit back to SHADOW until Owner deletes it.

      - name: Refresh ship-readiness dashboard
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/ship_readiness.py || true

      - name: Upload emitted artifacts to R2 (staging)
        env:
          # R2 upload uses the S3-compatible endpoint. Secrets are added
          # by Owner via the GitHub repo Secrets UI. If any secret is
          # missing (initial run before Owner adds them), the step
          # skips gracefully so the shadow log commit still lands.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: helios-data-staging
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 credentials not configured — skipping upload."
            exit 0
          fi
          pip install --quiet awscli
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Emitted call/brief/backtest artifacts + equity curve
          for KEY in weekly/current.json daily/current.json backtest/summary.json backtest/curve.json; do
            SRC="results/emitted/${KEY}"
            if [ -f "$SRC" ]; then
              aws s3 cp "$SRC" "s3://${R2_BUCKET}/${KEY}" \
                --endpoint-url "$ENDPOINT" \
                --content-type application/json \
                --cache-control "public, max-age=30, s-maxage=30"
              echo "Uploaded ${KEY} to ${R2_BUCKET}"
            fi
          done
          # Weekly history — index + per-week snapshots. Recursive upload;
          # aws s3 cp handles the whole directory in one call.
          if [ -d "results/emitted/history" ]; then
            aws s3 cp results/emitted/history/ "s3://${R2_BUCKET}/history/" \
              --recursive \
              --endpoint-url "$ENDPOINT" \
              --content-type application/json \
              --cache-control "public, max-age=30, s-maxage=30"
            echo "Uploaded history/ to ${R2_BUCKET}"
          fi
          # Kill-switch: uploaded so site-loader can render-time check (per
          # DEPLOY-PLAN §Site-loader behavior). Owner writes admin/killswitch.json
          # in the repo; cron mirrors it to R2. Cache TTL matches AXIS convention
          # (30s) so a flip propagates fast.
          if [ -f "admin/killswitch.json" ]; then
            aws s3 cp "admin/killswitch.json" "s3://${R2_BUCKET}/admin/killswitch.json" \
              --endpoint-url "$ENDPOINT" \
              --content-type application/json \
              --cache-control "public, max-age=30, s-maxage=30"
            echo "Uploaded admin/killswitch.json to ${R2_BUCKET}"
          fi

      - name: Commit and push results
        run: |
          git config user.name "helios-bot"
          git config user.email "helios-bot@users.noreply.github.com"
          # Only stage tracked artifact directories; raw data is gitignored
          # and .env must NEVER be committed.
          # history/ is inside results/emitted/ so already covered by that add,
          # but list explicitly for clarity.
          git add results/emitted/ results/shadow/ results/ship_readiness.json \
                  results/drift_status.json admin/drift.flag 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "helios-bot: daily shadow log ${TODAY}

            Automated daily pipeline run — pull data, rebuild features,
            append shadow log entry, refresh emitted artifacts.

            Agent: helios"
            git push
          fi
